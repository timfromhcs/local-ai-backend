[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localai-gateway"
version = "0.4.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi",
  "uvicorn",
  "httpx",
  "psutil",
  "pydantic>=2",
  "pyyaml",
]

[project.scripts]
localai-gateway = "localai_gateway.__main__:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "onnxruntime", "onnx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["real: tests that need real model binaries/files (deselect with -m 'not real')"]
