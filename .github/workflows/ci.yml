name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Unit tests (hermetic)
        run: python -m pytest -m "not real" -q
      - name: Doctor (must not crash; may report no models)
        run: python -m localai_gateway --doctor
        continue-on-error: true
      - name: Version
        run: python -m localai_gateway --version

  web:
    name: web static gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate web/ (vercel.json, JS syntax, i18n coverage, assets)
        run: node scripts/check-web.mjs

  security:
    name: secret scan + dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: "Install (an outdated pip itself carries CVEs)"
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -e ".[dev]"
      - name: Secret scan (no third-party action)
        run: python scripts/scan_secrets.py
      - name: Dependency audit
        run: python -m pip_audit --skip-editable
      - name: SBOM smoke check
        run: python scripts/sbom.py --out dist/sbom.cdx.json

  a11y:
    name: accessibility audit (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Playwright
        working-directory: packages/webtest
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Audit web/ (overflow, tap targets, contrast, focus, motion)
        run: node scripts/audit-web.mjs

  exe:
    name: one-file exe (windows)
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller
      - name: Build exe (no model weights)
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/localai-gateway.spec
      - name: Smoke test the exe
        shell: pwsh
        run: |
          $exe = "dist\localai-gateway.exe"
          if (-not (Test-Path $exe)) { throw "exe not built" }
          & $exe --version
          $p = Start-Process -FilePath $exe -ArgumentList @("--port", "18090") -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $r = Invoke-RestMethod -Uri "http://127.0.0.1:18090/healthz" -TimeoutSec 2
              if ($r.status -eq "ok") { $ok = $true; break }
            } catch { }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "healthz did not answer" }
          Write-Host "smoke test passed, size $((Get-Item $exe).Length / 1MB) MB"
      - uses: actions/upload-artifact@v7
        with:
          name: localai-gateway-exe
          path: dist/localai-gateway.exe
          retention-days: 30

  deploy-web:
    name: vercel production (optional)
    runs-on: ubuntu-latest
    needs: [web]
    if: github.ref == 'refs/heads/main'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Skip without token
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN is not set - skipping. Add it in Settings > Secrets to enable deploys."
      - uses: actions/setup-node@v5
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: "22"
      - name: Deploy web/ to production
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel deploy --prod --yes --token "$VERCEL_TOKEN" --cwd web
