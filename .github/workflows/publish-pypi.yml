name: publish-pypi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -m "not real" -q
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: trusted publishing
    runs-on: ubuntu-latest
    needs: [build]
    # Configure the publisher once at https://pypi.org/manage/account/publishing/
    # (owner timfromhcs, repo local-ai-backend, workflow publish-pypi.yml, environment pypi).
    environment:
      name: pypi
      url: https://pypi.org/p/localai-gateway
    permissions:
      id-token: write # OIDC, no token stored
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
