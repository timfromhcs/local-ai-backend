models:
  # --- the pair behind the virtual model `duo` (both stay resident: 9000 + 3600 MB < 70 % budget) ---
  - id: qwen3-4b
    kind: llm
    runtime: llama
    est_mem_mb: 3600
    warm_prefix: true
    args: ["-c", "16384", "-ngl", "99", "-fa", "on", "-ctk", "q8_0", "-ctv", "q8_0", "--no-warmup", "-np", "1", "-t", "8", "-ub", "256", "--jinja"]
    notes: "Executor (abliterated Qwen3-4B Q4_K_M, ~22.6 tok/s decode measured). --jinja is required for tool calls; keep KV at q8_0 (q4_0 degrades tool calling)."
    files:
      - mlabonne_Qwen3-4B-abliterated-Q4_K_M.gguf
  - id: bonsai-27b
    kind: llm
    runtime: llama
    est_mem_mb: 9000
    args: ["-c", "8192", "-ngl", "99", "-fa", "on", "-ctk", "q8_0", "-ctv", "q8_0", "--no-warmup", "-np", "1", "-t", "8", "-ub", "256", "-b", "2048", "--jinja"]
    notes: "Planner and verifier, thinking ON. Context reduced 16384 -> 8192 on 2026-11-04: at 16k the q8 KV plus the 4B executor did not fit in the shared VRAM carve-out. Measured 2026-11-04: even at 8k and even at -ngl 40 it does not load while the fast-lane server runs (a 0.9 GB allocation already fails); it only loads with the fast lane stopped. Use it for batch work, not as the default planner on a 12 GB shared carve-out."
    files:
      - Bonsai-2-27B-Philadelphia-Class-MIXED-PTQ1-Q4_0.gguf
  # --- external System-1 server (not started by the gateway; the user's Jev llama-server) ---
  - id: jev-1.5b
    kind: llm
    runtime: external
    endpoint: "http://127.0.0.1:8080"
    api_key: local
    est_mem_mb: 0
    notes: "Qwen2.5-Coder-1.5B Q4 on port 8080 (56 tok/s decode). Fast lane for trivial requests (titles, routing). Started with --api-key local, so the gateway must send the bearer header."
    files: []
  # --- virtual model: what OpenCode sees as ONE model ---
  - id: duo
    kind: llm
    runtime: virtual
    est_mem_mb: 0
    notes: "plan with bonsai-27b -> execute with qwen3-4b (tools) -> verify with bonsai-27b -> loop until VERIFIED (bounded)."
    files: []
  - id: flux2-klein
    kind: image
    runtime: sd
    est_mem_mb: 4200
    experimental: true
    notes: "Works only with non-spec files: diffusers VAE (diffusion_pytorch_model.safetensors) + Qwen3-4B gguf as --llm; vae.safetensors alone fails. Output not yet PNG-validated."
    files:
      - bonsai-flux2-klein-ternary-q2_k.gguf
      - diffusion_pytorch_model.safetensors
      - mlabonne_Qwen3-4B-abliterated-Q4_K_M.gguf
  - id: lance-video
    kind: video
    runtime: sd
    est_mem_mb: 8000
    status: unsupported
    reason: "llama-server/sd-server cannot load: gguf_init_from_reader: tensor name 11 is too long: 69 >= 64 (sd: get sd version from file failed)"
    files:
      - "Lance_3B_Video-Q5_K_M (1).gguf"
  - id: slat-3d
    kind: image3d
    runtime: sd
    est_mem_mb: 3000
    status: unsupported
    reason: "llama-server: unknown model architecture: 'flux' (sd-server: get sd version from file failed)"
    files:
      - slat_flow_imgshape2tex_dit_1_3B_1024_bf16_Q4_K_M.gguf
      - ss_dec_conv3d_16l8_fp16.safetensors
