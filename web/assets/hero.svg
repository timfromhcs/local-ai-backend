<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 660" role="img" aria-label="A local gateway routing requests to two models">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131a2b"/><stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3550"/><stop offset="1" stop-color="#1a2230"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".45"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="880" height="660" rx="28" fill="url(#bg)"/>
  <g stroke="#22304a" stroke-width="1" opacity=".55">
    <path d="M0 110h880M0 220h880M0 330h880M0 440h880M0 550h880"/>
    <path d="M110 0v660M220 0v660M330 0v660M440 0v660M550 0v660M660 0v660M770 0v660"/>
  </g>

  <circle cx="440" cy="330" r="230" fill="url(#glow)" filter="url(#soft)"/>

  <!-- clients -->
  <g>
    <rect x="52" y="120" width="150" height="64" rx="14" fill="url(#node)" stroke="#2d3a55"/>
    <text x="127" y="150" text-anchor="middle" fill="#e8edf5" font-family="Segoe UI, system-ui" font-size="15" font-weight="600">Editor</text>
    <text x="127" y="170" text-anchor="middle" fill="#8fa0bb" font-family="Segoe UI, system-ui" font-size="12">OpenAI SDK</text>

    <rect x="52" y="300" width="150" height="64" rx="14" fill="url(#node)" stroke="#2d3a55"/>
    <text x="127" y="330" text-anchor="middle" fill="#e8edf5" font-family="Segoe UI, system-ui" font-size="15" font-weight="600">Browser</text>
    <text x="127" y="350" text-anchor="middle" fill="#8fa0bb" font-family="Segoe UI, system-ui" font-size="12">WebGPU / ONNX</text>

    <rect x="52" y="480" width="150" height="64" rx="14" fill="url(#node)" stroke="#2d3a55"/>
    <text x="127" y="510" text-anchor="middle" fill="#e8edf5" font-family="Segoe UI, system-ui" font-size="15" font-weight="600">Agent</text>
    <text x="127" y="530" text-anchor="middle" fill="#8fa0bb" font-family="Segoe UI, system-ui" font-size="12">MCP tools</text>
  </g>

  <g stroke="#4b5a7a" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M202 152h96c26 0 40 14 56 38" opacity=".8"/>
    <path d="M202 332h176" opacity=".9"/>
    <path d="M202 512h96c26 0 40-14 56-38" opacity=".8"/>
  </g>
  <g fill="#7c8cab">
    <circle cx="236" cy="152" r="3"/><circle cx="268" cy="332" r="3"/><circle cx="236" cy="512" r="3"/>
  </g>

  <!-- gateway -->
  <g>
    <rect x="320" y="250" width="240" height="164" rx="22" fill="#0f1523" stroke="#3b4a6b" stroke-width="1.5"/>
    <rect x="338" y="268" width="204" height="42" rx="12" fill="url(#core)"/>
    <text x="440" y="295" text-anchor="middle" fill="#fff" font-family="Segoe UI, system-ui" font-size="16" font-weight="700">gateway :8090</text>
    <text x="440" y="334" text-anchor="middle" fill="#a9b7d0" font-family="Segoe UI, system-ui" font-size="12.5">budget · LRU · refcount</text>
    <text x="440" y="356" text-anchor="middle" fill="#a9b7d0" font-family="Segoe UI, system-ui" font-size="12.5">mode: fast · duo · big-out</text>
    <text x="440" y="378" text-anchor="middle" fill="#8fa0bb" font-family="Segoe UI, system-ui" font-size="11.5">CORS: explicit origins</text>
  </g>

  <!-- models -->
  <g>
    <rect x="664" y="150" width="164" height="88" rx="16" fill="url(#node)" stroke="#3a4a6b"/>
    <text x="746" y="182" text-anchor="middle" fill="#e8edf5" font-family="Segoe UI, system-ui" font-size="14.5" font-weight="700">27B planner</text>
    <text x="746" y="202" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, system-ui" font-size="12.5">5.9 tok/s</text>
    <text x="746" y="220" text-anchor="middle" fill="#8fa0bb" font-family="Segoe UI, system-ui" font-size="11.5">9 GB resident</text>

    <rect x="664" y="292" width="164" height="80" rx="16" fill="url(#node)" stroke="#3a4a6b"/>
    <text x="746" y="322" text-anchor="middle" fill="#e8edf5" font-family="Segoe UI, system-ui" font-size="14.5" font-weight="700">4B executor</text>
    <text x="746" y="342" text-anchor="middle" fill="#34d399" font-family="Segoe UI, system-ui" font-size="12.5">22.6 tok/s</text>
    <text x="746" y="360" text-anchor="middle" fill="#8fa0bb" font-family="Segoe UI, system-ui" font-size="11.5">tool calls</text>

    <rect x="664" y="424" width="164" height="80" rx="16" fill="url(#node)" stroke="#3a4a6b"/>
    <text x="746" y="454" text-anchor="middle" fill="#e8edf5" font-family="Segoe UI, system-ui" font-size="14.5" font-weight="700">1.5B router</text>
    <text x="746" y="474" text-anchor="middle" fill="#9db4ff" font-family="Segoe UI, system-ui" font-size="12.5">55.7 tok/s</text>
    <text x="746" y="492" text-anchor="middle" fill="#8fa0bb" font-family="Segoe UI, system-ui" font-size="11.5">System 1 · Jev</text>
  </g>

  <g stroke="#54648a" stroke-width="2" fill="none" stroke-dasharray="6 6" stroke-linecap="round">
    <path d="M560 306c40-16 58-100 104-118"/>
    <path d="M560 332h104"/>
    <path d="M560 360c40 16 58 100 104 104"/>
  </g>

  <g font-family="Segoe UI, system-ui" font-size="11.5" fill="#6f8099">
    <text x="64" y="620">no cloud · no account · one endpoint</text>
    <text x="816" y="620" text-anchor="end">measured on a Ryzen 7 7735HS</text>
  </g>
</svg>
